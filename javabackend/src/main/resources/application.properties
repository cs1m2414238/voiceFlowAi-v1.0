spring.application.name=javabackend
server.port=${SERVER_PORT:8080}

# Database Configuration (defaults to H2 in PostgreSQL compatibility mode; override via SPRING_DATASOURCE_URL for PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:voiceflowdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway (enable in production PostgreSQL via FLYWAY_ENABLED=true)
spring.flyway.enabled=${FLYWAY_ENABLED:false}

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Configuration
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Python AI Service Configuration
ai.service.base-url=${AI_SERVICE_BASE_URL:http://localhost:8000}
ai.service.timeout-seconds=${AI_SERVICE_TIMEOUT_SECONDS:30}
