# Production profile configuration (PostgreSQL + Flyway)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/voiceflow}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:voiceflow}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:voiceflow_secret}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.h2.console.enabled=false
ai.service.base-url=${AI_SERVICE_BASE_URL:http://python-ai-service:8000}
