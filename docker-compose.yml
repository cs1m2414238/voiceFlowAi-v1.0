version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: voiceflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-voiceflow_db}
      POSTGRES_USER: ${POSTGRES_USER:-voiceflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voiceflow_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-voiceflow} -d ${POSTGRES_DB:-voiceflow_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  java-backend:
    build:
      context: ./javabackend
      dockerfile: Dockerfile
    container_name: voiceflow-java-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-voiceflow_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-voiceflow}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-voiceflow_pass}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      AI_SERVICE_URL: http://python-ai-service:8000
    ports:
      - "8080:8080"

  python-ai-service:
    build:
      context: ./python-ai-service
      dockerfile: Dockerfile
    container_name: voiceflow-python-ai
    restart: unless-stopped
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      JAVA_BACKEND_URL: http://java-backend:8080
      CHROMA_PERSIST_DIR: /app/chroma_test_db
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/app/chroma_test_db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: voiceflow-frontend
    restart: unless-stopped
    depends_on:
      - java-backend
      - python-ai-service
    ports:
      - "5173:80"

  nginx:
    image: nginx:1.27-alpine
    container_name: voiceflow-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - java-backend
      - python-ai-service
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  postgres_data:
  chroma_data:
