worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 25M;

    upstream frontend_upstream {
        server frontend:80;
    }

    upstream java_backend_upstream {
        server java-backend:8080;
    }

    upstream python_ai_upstream {
        server python-ai-service:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # Java Spring Boot Backend REST APIs
        location /api/ {
            proxy_pass http://java_backend_upstream/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Python FastAPI AI & LangGraph Endpoints
        location /agent/ {
            proxy_pass http://python_ai_upstream/agent/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /rag/ {
            proxy_pass http://python_ai_upstream/rag/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /documents/ {
            proxy_pass http://python_ai_upstream/documents/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /speech/ {
            proxy_pass http://python_ai_upstream/speech/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /chat/ {
            proxy_pass http://python_ai_upstream/chat/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # React Frontend SPA
        location / {
            proxy_pass http://frontend_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
